[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sololeveling-video-learning"
version = "0.1.0"
description = "Offline video learning pipeline for Minecraft gameplay recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
sl-video = "video_learning.cli:main"

[tool.setuptools.packages.find]
include = ["video_learning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
