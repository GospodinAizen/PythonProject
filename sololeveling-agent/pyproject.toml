[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sololeveling-video"
version = "0.1.0"
description = "Video-only experience extraction for gameplay recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
sl-video = "sololeveling_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
